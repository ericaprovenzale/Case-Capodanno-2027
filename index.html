<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capodanno 2026/2027 – Confronto 12 Case & Ville (Como, Svizzera, Italia & Francia)</title>
  <meta name="description" content="Confronto interattivo delle 12 case per Capodanno 2026/2027 (31 Dic – 2 Gen): 4 a Como e 8 tra Svizzera, Italia e Francia." />
  <meta name="theme-color" content="#1e1b4b" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .card-shadow { box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04); }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-600 selection:text-white">

  <!-- HEADER HERO -->
  <header class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white relative overflow-hidden border-b border-indigo-900/60">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 relative z-10">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div>
          <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white">
            Capodanno 2026/2027 – Confronto 12 Case & Ville
          </h1>
          <p class="text-slate-300 text-sm sm:text-base mt-1">
            4 case a Como in cima e 8 tra Svizzera 🇨🇭, Italia e Francia 🇫🇷 ordinate per valutazione.
          </p>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTROLLI E FILTRI -->
  <section class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white">Tutte le Case (12)</button>
        <button onclick="setFilter('como')" id="filter-como" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700">Como (4)</button>
        <button onclick="setFilter('other')" id="filter-other" class="filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700">Altre (8)</button>
      </div>
      <button onclick="resetToDefaultData()" class="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold border">↺ Ripristina Dati</button>
    </div>
  </section>

  <!-- CONTENUTO PRINCIPALE (GRIGLIE) -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full space-y-12">

    <!-- SEZIONE COMO -->
    <section id="section-como">
      <h2 class="text-2xl font-extrabold text-slate-900 mb-4">Como e Lago di Como (<span id="comoCountBadge">0</span>)</h2>
      <div id="comoGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>
    </section>

    <!-- SEZIONE ALTRE -->
    <section id="section-other">
      <h2 class="text-2xl font-extrabold text-slate-900 mb-4">Altre Destinazioni (<span id="otherCountBadge">0</span>)</h2>
      <div id="otherGrid" class="grid grid-cols-1 lg:grid-cols-2 gap-6"></div>
    </section>

    <!-- TABELLA COMPARATIVA -->
    <section id="section-summary-table">
      <div class="bg-white rounded-2xl border border-slate-200 card-shadow overflow-hidden">
        <div class="px-5 py-4 bg-slate-900 text-white font-extrabold">Tabella Comparativa Completa</div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead>
              <tr class="bg-slate-100 text-slate-700 border-b">
                <th class="p-3">Struttura</th>
                <th class="p-3">Località</th>
                <th class="p-3">Valutazione</th>
                <th class="p-3">Camere & Letti</th>
                <th class="p-3">Prezzo Totale</th>
              </tr>
            </thead>
            <tbody id="fullComparisonTableBody" class="divide-y divide-slate-200"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- LOGICA JAVASCRIPT SICURA -->
  <script>
    const STORAGE_KEY = 'capodanno_2026_fix_v4';

    const defaultProperties = [
      {
        id: 1, sheetNumber: "#1 Como", name: "TheLuxe Residences", group: "como",
        location: "Viale Fratelli Rosselli, 5A, Como", isSwitzerland: false, isBlocked: true,
        ratingNormalized: 9.8, ratingDisplay: "9.8/10", platform: "Booking.com",
        priceAccommodation: 1518, guestsCapacity: "8-10 persone", apartmentsCount: "2 appartamenti",
        bedroomsCount: "3 camere", bedsDetail: "3 camere + 2 divani letto", sofaBedsCount: 2, sofaBedsLabel: "2 divani letto",
        bathroomsCount: "2 bagni", livingRoomsCount: "2 soggiorni", distanceRoundTripKm: 350,
        fuelPerCar: 45, tollsPerCar: 38, tollsNote: "Caselli A/R ~€38", cancellation: "Bloccato - Cancellazione gratuita",
        hasFreeCancel: true, bookingUrl: "https://www.booking.com/Share-BmJkPc"
      },
      {
        id: 2, sheetNumber: "#2 Como", name: "Volta Suites", group: "como",
        location: "Como", isSwitzerland: false, isBlocked: false,
        ratingNormalized: 9.4, ratingDisplay: "9.4/10", platform: "Booking.com",
        priceAccommodation: 1859, guestsCapacity: "8 adulti", apartmentsCount: "2 appartamenti",
        bedroomsCount: "4 camere", bedsDetail: "4 camere (0 divani letto)", sofaBedsCount: 0, sofaBedsLabel: "0 divani letto",
        bathroomsCount: "2 bagni", livingRoomsCount: "2 soggiorni", distanceRoundTripKm: 350,
        fuelPerCar: 45, tollsPerCar: 38, tollsNote: "Caselli A/R ~€38", cancellation: "Non rimborsabile",
        hasFreeCancel: false, bookingUrl: "https://www.booking.com/Share-FbaaYN"
      },
      {
        id: 5, sheetNumber: "#1 Altre", name: "Villa prestige Lyon Ouest", group: "other",
        location: "Écully (Lione), Francia", isSwitzerland: false, isBlocked: false,
        ratingNormalized: 9.8, ratingDisplay: "9.8/10", platform: "Booking.com",
        priceAccommodation: 1771, guestsCapacity: "Max 10 persone", apartmentsCount: "1 villa",
        bedroomsCount: "5 camere", bedsDetail: "5 camere matrimoniali", sofaBedsCount: 0, sofaBedsLabel: "0 divani letto",
        bathroomsCount: "5 bagni", livingRoomsCount: "1 soggiorno", distanceRoundTripKm: 630,
        fuelPerCar: 81, tollsPerCar: 112, tollsNote: "Frejus A/R ~€112", cancellation: "Cancellazione gratuita",
        hasFreeCancel: true, bookingUrl: "https://www.booking.com/Share-CPpnFj"
      },
      {
        id: 6, sheetNumber: "#2 Altre (CH)", name: "Schloss Locarno", group: "other",
        location: "Locarno, Svizzera", isSwitzerland: true, isBlocked: false,
        ratingNormalized: 9.3, ratingDisplay: "9.3/10", platform: "Booking.com",
        priceAccommodation: 1829, guestsCapacity: "10 persone", apartmentsCount: "2 appartamenti",
        bedroomsCount: "3 camere", bedsDetail: "3 camere + 2 divani letto", sofaBedsCount: 2, sofaBedsLabel: "2 divani letto",
        bathroomsCount: "2 bagni", livingRoomsCount: "2 soggiorni", distanceRoundTripKm: 430,
        fuelPerCar: 55, tollsPerCar: 28, tollsNote: "Caselli + Vignetta CH €43", cancellation: "Cancellazione gratuita",
        hasFreeCancel: true, bookingUrl: "https://www.booking.com/Share-xJ5iM6P"
      }
    ];

    let properties = [];
    let currentFilter = 'all';

    function loadProperties() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        properties = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultProperties));
      } catch (err) {
        properties = JSON.parse(JSON.stringify(defaultProperties));
      }
    }

    function resetToDefaultData() {
      localStorage.removeItem(STORAGE_KEY);
      properties = JSON.parse(JSON.stringify(defaultProperties));
      renderAll();
    }

    function setFilter(filter) {
      currentFilter = filter;
      renderAll();
    }

    function renderAll() {
      const comoGrid = document.getElementById('comoGrid');
      const otherGrid = document.getElementById('otherGrid');
      const tbody = document.getElementById('fullComparisonTableBody');

      if (!comoGrid || !otherGrid || !tbody) return;

      const comoList = properties.filter(p => p.group === 'como');
      const otherList = properties.filter(p => p.group === 'other');

      document.getElementById('comoCountBadge').textContent = comoList.length;
      document.getElementById('otherCountBadge').textContent = otherList.length;

      document.getElementById('section-como').style.display = (currentFilter === 'other') ? 'none' : 'block';
      document.getElementById('section-other').style.display = (currentFilter === 'como') ? 'none' : 'block';

      comoGrid.innerHTML = comoList.map(p => createCardHtml(p)).join('');
      otherGrid.innerHTML = otherList.map(p => createCardHtml(p)).join('');

      tbody.innerHTML = [...comoList, ...otherList].map(p => `
        <tr>
          <td class="p-3 font-extrabold">${p.name}</td>
          <td class="p-3">${p.location}</td>
          <td class="p-3">⭐ ${p.ratingDisplay}</td>
          <td class="p-3">${p.bedsDetail}</td>
          <td class="p-3 font-bold">€ ${p.priceAccommodation}</td>
        </tr>
      `).join('');
    }

    function createCardHtml(p) {
      return `
        <div class="bg-white rounded-xl border p-5 shadow-sm space-y-3">
          <div class="flex justify-between items-start">
            <h3 class="font-extrabold text-lg">${p.name}</h3>
            <span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 text-xs font-bold">⭐ ${p.ratingDisplay}</span>
          </div>
          <p class="text-xs text-slate-600">📍 ${p.location}</p>
          <div class="bg-indigo-50 p-2.5 rounded-lg text-xs space-y-1">
            <div>🏢 <strong>Unità:</strong> ${p.apartmentsCount}</div>
            <div>🛏️ <strong>Letti:</strong> ${p.bedsDetail}</div>
            <div>🚿 <strong>Bagni:</strong> ${p.bathroomsCount}</div>
          </div>
          <div class="flex items-center justify-between pt-2">
            <span class="text-lg font-extrabold text-indigo-700">€ ${p.priceAccommodation}</span>
            <a href="${p.bookingUrl}" target="_blank" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-500">📸 Foto & Annuncio ↗</a>
          </div>
        </div>
      `;
    }

    // Avvio sicuro al caricamento completo del DOM
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        loadProperties();
        renderAll();
      });
    } else {
      loadProperties();
      renderAll();
    }
  </script>
</body>
</html>
